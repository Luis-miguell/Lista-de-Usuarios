    <!DOCTYPE html>
    <html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Formulario</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <script type="module" src="script.js" defer></script>
    </head>
    <body>
        <header>
            <h1>
                Lista de usuarios
            </h1>
            <button>
                <a href="Redirects/users.html">
                    Usuarios 
                    <i class="bi bi-arrow-bar-right"></i>
                </a>
            </button>
        </header>
        <main>
            <form>
                <h2>Agregar usuario</h2>
                <label for="foto">Foto de perfil (url): <input type="url" id="foto" name="foto"></label>
                <label for="nombre">Nombre: <input type="text" id="nombre" name="nombre" required></label>
                <label for="edad">Edad: <input type="number" id="edad" name="edad" required></label>
                <label for="correo">Correo: <input type="email" id="correo" name="correo" required></label>
                <label for="password">Contraseña: <input type="password" id="password" name="contrasenia" required></label>
                <div class="botones">
                    <button>Agregar</button>
                    <button type="reset">Limpiar</button>
                </div>
            </form>
        </main>
    </body>
    </html>
